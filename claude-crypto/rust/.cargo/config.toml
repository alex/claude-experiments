# Cross-compiling for AArch64 and running the tests under QEMU user-mode
# emulation: `cargo test --target aarch64-unknown-linux-gnu`.
[target.aarch64-unknown-linux-gnu]
linker = "aarch64-linux-gnu-gcc"
runner = "qemu-aarch64 -L /usr/aarch64-linux-gnu"

# ppc64le (POWER8+): `cargo test --target powerpc64le-unknown-linux-gnu`.
[target.powerpc64le-unknown-linux-gnu]
linker = "powerpc64le-linux-gnu-gcc"
runner = "qemu-ppc64le -cpu power8 -L /usr/powerpc64le-linux-gnu"
