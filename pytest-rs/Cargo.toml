[package]
name = "pytest-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "A pytest-compatible test runner implemented in Rust with pyo3"
license = "Apache-2.0 OR BSD-3-Clause"

[lib]
name = "_pytest_rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.29", features = ["auto-initialize", "py-clone"] }
# Deterministic hashing so run-to-run ordering is stable for a given seed.
indexmap = "2"
rustc-hash = "2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
